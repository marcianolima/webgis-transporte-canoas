services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: transporte
      POSTGRES_DB: transporte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no servidor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U transporte -d transporte']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgresql://transporte:${POSTGRES_PASSWORD}@db:5432/transporte
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Defina ADMIN_API_KEY com pelo menos 32 caracteres}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-https://marcianolima.github.io}
      SOURCE_HOMOLOGATED: ${SOURCE_HOMOLOGATED:-false}
      PUBLIC_POSITIONS_ENABLED: ${PUBLIC_POSITIONS_ENABLED:-false}
      PUBLIC_API_LIMIT_PER_MINUTE: ${PUBLIC_API_LIMIT_PER_MINUTE:-60}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:8000:8000']
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
  worker:
    profiles: [gps]
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: [python, -m, transporte.worker]
    environment:
      DATABASE_URL: postgresql://transporte:${POSTGRES_PASSWORD}@db:5432/transporte
      SOURCE_HOMOLOGATED: ${SOURCE_HOMOLOGATED:-false}
      GPS_FEED_URL: ${GPS_FEED_URL:-}
      GPS_FEED_ALLOWED_HOST: ${GPS_FEED_ALLOWED_HOST:-}
      GPS_FEED_TOKEN: ${GPS_FEED_TOKEN:-}
      GPS_INTERVAL_SECONDS: ${GPS_INTERVAL_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
  edge:
    image: nginx:stable-alpine
    profiles: [edge]
    depends_on:
      - api
    ports:
      - "${EDGE_HTTPS_BIND:-0.0.0.0}:443:8443"
    environment:
      API_HOST: ${API_HOST:-api.transporte.example.invalid}
    volumes:
      - ./infra/nginx-compose.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-./infra/certs}:/etc/nginx/certs:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    # O master do Nginx precisa criar diretórios temporários e baixar
    # privilégios para o worker; remover CHOWN/SETUID quebraria o contêiner.
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt:
      - no-new-privileges:true
  gobus-live:
    profiles: [gobus-live]
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: [python, -m, transporte.gobus_live_worker]
    environment:
      DATABASE_URL: postgresql://transporte:${POSTGRES_PASSWORD}@db:5432/transporte
      GOBUS_READ_AUTHORIZED: ${GOBUS_READ_AUTHORIZED:-false}
      GOBUS_ACCEPT_HTTP: ${GOBUS_ACCEPT_HTTP:-false}
      GOBUS_REQUEST_SPACING: ${GOBUS_REQUEST_SPACING:-15}
      GOBUS_CYCLE_SECONDS: ${GOBUS_CYCLE_SECONDS:-180}
      GOBUS_MAX_PER_HOUR: ${GOBUS_MAX_PER_HOUR:-120}
      GOBUS_MAX_PER_DAY: ${GOBUS_MAX_PER_DAY:-1000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - gobus_private:/app/var/gobus
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
volumes:
  postgres_data:
  gobus_private:
